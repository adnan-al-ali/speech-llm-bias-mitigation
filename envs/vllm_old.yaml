name: sbm-vllm
channels:
  - conda-forge
dependencies:
  - python==3.12
  - pip==25.2
  - ffmpeg==8.0.1
  - libstdcxx-ng
  - pip:
    - snakemake==9.20.0
    - datasets==4.3.0
    - torchcodec==0.10
    - vllm[audio]==0.19.0 --extra-index-url https://download.pytorch.org/whl/cu129
    - torch==2.10.0
    - accelerate==1.13.0
    - numpy==2.2
    - pandas
    - matplotlib
    - openai
variables:
  LD_LIBRARY_PATH: /opt/cuda/13.1/lib64:$CONDA_PREFIX/lib:$LD_LIBRARY_PATH